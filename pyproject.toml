[project]
name = "expansion-retail"
version = "0.1.0"
description = "Municipality recommender for retail store expansion in Mexico"
requires-python = ">=3.12"
# Dependencies are added with `uv add <package>` as they are needed.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expansion"]
